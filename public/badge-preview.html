<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>永和證件套示意圖</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #f3f4f6;
      color: #0f172a;
      padding: 24px 16px 48px;
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    .note { color: #64748b; font-size: 0.875rem; margin-bottom: 24px; }
    .grid {
      display: grid;
      gap: 28px;
      max-width: 760px;
      margin: 0 auto;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }
    .card-wrap { max-width: 22rem; margin: 0 auto; width: 100%; }
    .card {
      position: relative;
      width: 100%;
      aspect-ratio: 873 / 1250;
      border-radius: 0.75rem;
      overflow: hidden;
      border: 1px solid rgba(251, 113, 133, 0.45);
      box-shadow: 0 10px 28px rgba(120, 40, 55, 0.12);
      background-size: cover;
      background-position: center;
    }
    .photo {
      position: absolute;
      left: 41.58%;
      top: 43.28%;
      width: 35.05%;
      height: 31.12%;
      overflow: hidden;
      background: #fff;
    }
    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      display: block;
    }
    .name {
      position: absolute;
      left: 41.58%;
      width: 35.05%;
      top: 75.4%;
      text-align: center;
      font-weight: 900;
      font-size: clamp(1.05rem, 5.2vw, 1.35rem);
      letter-spacing: 0.06em;
      margin: 0;
      line-height: 1;
    }
    .caption {
      text-align: center;
      margin-top: 10px;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <h1>永和證件套模板示意圖</h1>
  <p class="note">背景來自《永和_證件套模板》官方裁切；證件照與姓名為模擬疊加。</p>
  <div class="grid">
    <div class="card-wrap">
      <article class="card" style="background-image:url('/badges/yonghe-badge-sleeve-front.jpg')" aria-label="Joe訪員 訪員證">
        <div class="photo">
          <img src="/badges/joe-visitor-portrait.jpg" alt="Joe訪員 證件照（模擬）" />
        </div>
        <p class="name">Joe訪員</p>
      </article>
      <p class="caption">正面 · Joe訪員</p>
    </div>
    <div class="card-wrap">
      <article class="card" style="background-image:url('/badges/yonghe-badge-sleeve-front.jpg')" aria-label="張教授 訪員證">
        <div class="photo">
          <img src="/badges/zhang-visitor-portrait.jpg" alt="張教授 證件照（模擬）" />
        </div>
        <p class="name">張教授</p>
      </article>
      <p class="caption">正面 · 張教授</p>
    </div>
    <div class="card-wrap">
      <article class="card" style="background-image:url('/badges/yonghe-badge-sleeve-back.jpg')" aria-label="訪員證背面"></article>
      <p class="caption">背面守則（點手機證卡可翻面）</p>
    </div>
  </div>
</body>
</html>
