<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>永和證件套示意圖</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #f3f4f6;
      color: #0f172a;
      padding: 24px 16px 48px;
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    .note { color: #64748b; font-size: 0.875rem; margin-bottom: 24px; }
    .grid {
      display: grid;
      gap: 28px;
      max-width: 760px;
      margin: 0 auto;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }
    .card-wrap {
      container-type: inline-size;
      margin: 0 auto;
      width: 100%;
      max-width: min(100%, 22rem, calc((100dvh - 8rem) * 781 / 1076));
    }
    .card {
      position: relative;
      width: 100%;
      max-width: 100%;
      aspect-ratio: 781 / 1076;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 8px 24px rgba(120, 40, 55, 0.1);
    }
    .card > .sleeve {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      pointer-events: none;
    }
    .photo {
      position: absolute;
      left: 33.03%;
      top: 38.20%;
      width: 37.77%;
      height: 35.32%;
      overflow: hidden;
      background: #fff;
    }
    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      display: block;
    }
    .name {
      position: absolute;
      left: 33.03%;
      width: 37.77%;
      top: 74.81%;
      text-align: center;
      font-weight: 900;
      font-size: clamp(1.15rem, 8.5cqw, 1.85rem);
      letter-spacing: 0.08em;
      margin: 0;
      line-height: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .caption {
      text-align: center;
      margin-top: 10px;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <h1>永和證件套模板示意圖</h1>
  <p class="note">
    單張裁切含完整黑框；證件照疊在灰框內不蓋過框線。整張會依手機可視範圍自動縮小，不超出畫面與證件黑框。
  </p>
  <div class="grid">
    <div class="card-wrap">
      <article class="card" aria-label="Joe訪員 訪員證">
        <img class="sleeve" src="/badges/yonghe-badge-sleeve-front.jpg" alt="" />
        <div class="photo">
          <img src="/badges/joe-visitor-portrait.jpg" alt="Joe訪員 證件照（模擬）" />
        </div>
        <p class="name">Joe訪員</p>
      </article>
      <p class="caption">正面 · Joe訪員（含完整黑框）</p>
    </div>
    <div class="card-wrap">
      <article class="card" aria-label="張教授 訪員證">
        <img class="sleeve" src="/badges/yonghe-badge-sleeve-front.jpg" alt="" />
        <div class="photo">
          <img src="/badges/zhang-visitor-portrait.jpg" alt="張教授 證件照（模擬）" />
        </div>
        <p class="name">張教授</p>
      </article>
      <p class="caption">正面 · 張教授</p>
    </div>
    <div class="card-wrap">
      <article class="card" aria-label="訪員證背面">
        <img class="sleeve" src="/badges/yonghe-badge-sleeve-back.jpg" alt="" />
      </article>
      <p class="caption">背面守則（點手機證卡可翻面）</p>
    </div>
  </div>
</body>
</html>
